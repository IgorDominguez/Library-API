spring:
  config:
    import:
      - 'file:.env[.properties]'

  application:
    name: libraryapi

  datasource:
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}

  jpa:
    hibernate:
      ddl-auto: update

springdoc:
  api-docs:
    path: /openapi.json

  packages-to-scan:
    - com.github.igordominguez.libraryapi.controller

scalar:
  enabled: true
  url: /openapi.json
  page-title: Library API
